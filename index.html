<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="BriefRoom — one shared space for every reference, revision and final yes. Visual briefs and dual-approved agreements for custom orders." />
    <title>BriefRoom — Custom orders, without the guesswork</title>
    <!-- Applies the saved (or system) theme before first paint: no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('br.theme');
          var dark = p === 'dark' || ((p === null || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f0f11' : '#f6f5f1');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%2317161a'/%3E%3Crect x='7.5' y='9.5' width='14' height='14' rx='3' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='22.5' cy='9.5' r='5' fill='%23f6c343' stroke='%2317161a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
