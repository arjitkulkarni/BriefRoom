# Render Blueprint. Neon (Postgres + Object Storage) holds all state, so the web service is stateless:
# no persistent disk is needed. The Ohio region matches the Neon project's AWS us-east-2.
#
# Before creating it, read docs/RELEASE_VERIFICATION.md → "Deploying (Render)". Values marked `sync: false` are asked for once, when
# the Blueprint is first created (Render ignores them on later Blueprint syncs — edit them in the
# service's Environment tab instead). Use the PRODUCTION Neon branch values, never the dev branch.
services:
  - type: web
    name: briefroom
    runtime: node
    region: ohio
    # Paid instance: pre-deploy commands are only available on paid plans, and free instances sleep
    # after inactivity (slow first load for judges). On the free plan, delete `preDeployCommand` and run
    # `npm run db:migrate` yourself before deploying a release that adds a migration.
    plan: starter
    # NODE_ENV=production is visible during the build, which makes `npm ci` skip devDependencies
    # (vite, typescript, tailwind) — the build needs them, so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    # Additive, versioned migrations over the direct (unpooled) Neon URL, before the new release starts.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # PUBLIC_URL is optional on Render: the server falls back to RENDER_EXTERNAL_URL (the onrender.com
      # URL). Add PUBLIC_URL in the dashboard only when you attach a custom domain.
      - key: SESSION_SECRET
        generateValue: true
      # Neon PRODUCTION branch: pooled URL (host contains "-pooler") and direct URL (migrations).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Nexconn. The app ("First application", data centre Singapore) has ONE key pair, which the Console
      # labels "AppKey-Production" (checked 2026-11-22) — enter that pair here.
      - key: NEXCONN_ENVIRONMENT
        value: production
      - key: NEXCONN_PROD_APP_KEY
        sync: false
      - key: NEXCONN_PROD_APP_SECRET
        sync: false
      - key: NEXCONN_REGION
        value: sg
      # Neon Object Storage on the PRODUCTION branch (bucket declared in neon.ts).
      - key: UPLOAD_PROVIDER
        value: s3
      - key: S3_BUCKET
        value: assets
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      # AI ambiguity check (rules always run): OpenAI first, Grok (xAI) as fallback.
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
