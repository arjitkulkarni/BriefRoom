services:
  - type: web
    name: briefroom
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_API_DOMAIN
        value: api.sg-light-api.com
      - key: NEXCONN_API_DOMAIN_BACKUP
        value: api-b.sg-light-api.com
      - key: NEXCONN_AREA
        value: SG
      - key: PUBLIC_URL
        sync: false
